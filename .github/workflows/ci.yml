name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [game, backend, dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.project }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      # The Firestore emulator needs Java 21.
      - if: matrix.project == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      - if: matrix.project == 'backend'
        run: pnpm test:emulator

      - if: matrix.project != 'backend'
        run: pnpm build
